<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Portafolio | Cristóbal Torres</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #050505;
            overflow: hidden; /* Mantiene la barra de scroll de la página oculta */
            font-family: system-ui, sans-serif;
            color: #eee;
        }

        .top-bar {
            position: fixed;
            top: 12px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            letter-spacing: .15em;
            opacity: .8;
            z-index: 50;
            pointer-events: none;
        }

        .viewer-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor del libro */
        #flipbook {
            width: min(95vw, 1500px); 
            height: min(90vh, 900px);
            background: #050505;
            box-shadow: 0 0 40px rgba(0,0,0,.75);
            border-radius: 4px;
            overflow: hidden;
            /* --- CSS PARA ZOOM --- */
            transition: transform 0.2s ease-out; /* Transición suave del zoom */
            transform-origin: center center; /* El zoom se centra en el medio del libro */
            cursor: grab; /* Indica que el elemento puede ser arrastrado/paneado si se implementa */
        }

        /* Fondo interno del libro */
        .stf__wrapper { background: #050505 !important; }

        /* Páginas muy juntas */
        .stf__item { margin: 0 2.5px !important; }

        /* Lomo del libro */
        .stf__inner-shadow {
            opacity: 0.03 !important;
        }

        /* Asegurar la proporción de la imagen */
        .stf__block img {
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background-color: #050505; 
        }

        /* Botones */
        .controls {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
            z-index: 40;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,.25);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 40px;
            pointer-events: auto;
            cursor: pointer;
            transition: .2s;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,.15);
            border-color: rgba(255,255,255,.45);
            transform: translateY(-2px);
        }

        .ctrl-btn span {
            font-size: 26px;
            color: white;
            opacity: .85;
        }

    </style>
</head>

<body>

    <div class="top-bar">
        <div>PORTAFOLIO · CRISTÓBAL TORRES</div>
        <div id="pageIndicator">PÁGINA 1 / 34</div>
    </div>

    <div class="viewer-wrapper">
        <div id="flipbook"></div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn"><span>‹</span></button>
        <button class="ctrl-btn" id="nextBtn"><span>›</span></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const TOTAL = 34;
            const indicator = document.getElementById("pageIndicator");
            const flipbookElement = document.getElementById("flipbook");

            // --- CONFIGURACIÓN DE PAGEFLIP ---
            const flip = new St.PageFlip(flipbookElement, {
                width: 600,  
                height: 900, 
                size: "stretch",
                maxShadowOpacity: 0.1,
                showCover: true,
                autoSize: true,
                // **IMPORTANTE**: Deshabilita el soporte de scroll del móvil
                mobileScrollSupport: false
            });

            // Cargar imágenes
            const images = [];
            for (let i = 1; i <= TOTAL; i++) {
                images.push(`pages/page-${String(i).padStart(2,"0")}.jpg`); 
            }

            flip.loadFromImages(images);

            function update() {
                let i = flip.getCurrentPageIndex() + 1;
                indicator.textContent = `PÁGINA ${i} / ${TOTAL}`;
            }

            flip.on("flip", update);
            flip.on("init", update);

            // Botones
            document.getElementById("prevBtn").onclick = () => flip.flipPrev();
            document.getElementById("nextBtn").onclick = () => flip.flipNext();

            // Teclado
            window.addEventListener("keydown", e => {
                if (e.key === "ArrowRight") flip.flipNext();
                if (e.key === "ArrowLeft") flip.flipPrev();
            });

            // ==========================================================
            // === FUNCIONALIDAD DE ZOOM CON RUEDITA (SCROLL) ===
            // ==========================================================

            let currentScale = 1;
            const SCALE_STEP = 0.2;
            const MAX_SCALE = 3;
            const MIN_SCALE = 1;

            window.addEventListener('wheel', (e) => {
                e.preventDefault(); // Evita el scroll de toda la página

                const direction = e.deltaY > 0 ? -1 : 1; // Dirección del scroll: 1 para zoom in, -1 para zoom out

                // Calcular la nueva escala
                let newScale = currentScale + (direction * SCALE_STEP);
                
                // Limitar la escala
                newScale = Math.min(Math.max(MIN_SCALE, newScale), MAX_SCALE);

                // Aplicar la escala al elemento del libro
                flipbookElement.style.transform = `scale(${newScale})`;
                currentScale = newScale;

                // Si se hace zoom in (currentScale > 1), debes permitir el scroll en el body
                // para panear el contenido, sino el contenido ampliado queda fijo.
                if (currentScale > 1) {
                    document.body.style.overflow = 'auto';
                } else {
                    document.body.style.overflow = 'hidden';
                }
            }, { passive: false }); // Usar passive: false para que e.preventDefault() funcione

        });
    </script>

</body>
</html>
