<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Portafolio | Cristóbal Torres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #050505;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
    }

    .top-bar {
      position: fixed;
      top: 10px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.7;
      z-index: 10;
      pointer-events: none;
    }

    .viewer-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #222 0, #050505 55%);
    }

    .spread-frame {
      width: min(95vw, 1400px);
      height: min(90vh, 900px);
      background: #050505;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .page-img {
      height: 100%;
      width: 50%;
      object-fit: contain;
      background: #ffffff;           /* hoja blanca */
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* acercar más las páginas al centro */
    .page-img.left {
      margin-right: -4px;
    }
    .page-img.right {
      margin-left: -4px;
    }

    /* portada sola */
    .page-img.single {
      width: 100%;
      margin: 0;
    }

    /* “lomo” muy sutil */
    .spread-frame::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      background: rgba(0,0,0,0.15);
      pointer-events: none;
    }

    .controls {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .ctrl-btn {
      pointer-events: auto;
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 36px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
    }

    .ctrl-btn span {
      font-size: 26px;
      line-height: 1;
      opacity: 0.85;
    }

    .ctrl-btn:hover:not(:disabled) {
      background: rgba(255,255,255,0.1);
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.45);
    }

    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: default;
      transform: none;
    }

    @media (max-width: 768px) {
      .spread-frame {
        width: 100vw;
        height: 100vh;
        box-shadow: none;
      }
      .ctrl-btn {
        margin: 0 10px;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>PORTAFOLIO · CRISTÓBAL TORRES</div>
    <div id="pageIndicator">PÁGINA 1 / 34</div>
  </div>

  <div class="viewer-wrapper">
    <div class="spread-frame">
      <img id="leftPage"  class="page-img left" />
      <img id="rightPage" class="page-img right" />
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Anterior">
      <span>‹</span>
    </button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Siguiente">
      <span>›</span>
    </button>
  </div>

  <script>
    const TOTAL_PAGES = 34;

    // currentIndex = página que va a la IZQUIERDA del spread
    // 1 => portada sola
    // 2 => (2,3), 4 => (4,5), etc.
    let currentIndex = 1;

    const leftImg   = document.getElementById('leftPage');
    const rightImg  = document.getElementById('rightPage');
    const indicator = document.getElementById('pageIndicator');
    const prevBtn   = document.getElementById('prevBtn');
    const nextBtn   = document.getElementById('nextBtn');

    function pageSrc(n) {
      const s = String(n).padStart(2, '0');
      return `pages/page-${s}.jpg`;
    }

    function updateIndicator() {
      if (currentIndex === 1) {
        indicator.textContent = `PÁGINA 1 / ${TOTAL_PAGES}`;
      } else {
        const right = Math.min(currentIndex + 1, TOTAL_PAGES);
        indicator.textContent = `PÁGINAS ${currentIndex}–${right} / ${TOTAL_PAGES}`;
      }
    }

    function updateButtons() {
      prevBtn.disabled = currentIndex === 1;

      // último spread: si TOTAL_PAGES es par -> (TOTAL_PAGES-1, TOTAL_PAGES)
      const maxIndex = (TOTAL_PAGES % 2 === 0)
        ? TOTAL_PAGES - 1
        : TOTAL_PAGES;

      nextBtn.disabled = currentIndex >= maxIndex;
    }

    function animateReset() {
      leftImg.style.opacity  = '0';
      rightImg.style.opacity = '0';
      // pequeña sensación de “paso de página”
      leftImg.style.transform  = 'translateX(-20px)';
      rightImg.style.transform = 'translateX(20px)';
    }

    function animateIn(singlePortada) {
      requestAnimationFrame(() => {
        if (singlePortada) {
          leftImg.style.opacity   = '1';
          leftImg.style.transform = 'translateX(0)';
        } else {
          leftImg.style.opacity   = '1';
          rightImg.style.opacity  = '1';
          leftImg.style.transform  = 'translateX(0)';
          rightImg.style.transform = 'translateX(0)';
        }
      });
    }

    function showSpread() {
      animateReset();

      if (currentIndex === 1) {
        // Portada sola
        leftImg.classList.add('single');
        rightImg.style.display = 'none';

        const img = new Image();
        img.onload = () => {
          leftImg.src = pageSrc(1);
          animateIn(true);
        };
        img.src = pageSrc(1);

      } else {
        // Spreads dobles
        leftImg.classList.remove('single');
        rightImg.style.display = 'block';

        const leftPageNum  = currentIndex;
        const rightPageNum = Math.min(currentIndex + 1, TOTAL_PAGES);

        const imgL = new Image();
        const imgR = new Image();

        let loaded = 0;
        function checkLoaded() {
          loaded++;
          if (loaded === 2) {
            animateIn(false);
          }
        }

        imgL.onload = () => {
          leftImg.src = pageSrc(leftPageNum);
          checkLoaded();
        };
        imgR.onload = () => {
          rightImg.src = pageSrc(rightPageNum);
          checkLoaded();
        };

        imgL.src = pageSrc(leftPageNum);
        imgR.src = pageSrc(rightPageNum);
      }

      updateIndicator();
      updateButtons();
    }

    function goNext() {
      const maxIndex = (TOTAL_PAGES % 2 === 0)
        ? TOTAL_PAGES - 1
        : TOTAL_PAGES;

      if (currentIndex === 1) {
        if (TOTAL_PAGES >= 2) currentIndex = 2;           // pasa a (2,3)
      } else if (currentIndex + 2 <= maxIndex) {
        currentIndex += 2;                                // 2->4, 4->6, etc.
      }
      showSpread();
    }

    function goPrev() {
      if (currentIndex === 1) return;

      if (currentIndex === 2) {
        currentIndex = 1;                                 // volver a portada sola
      } else {
        currentIndex = Math.max(2, currentIndex - 2);     // 4->2, 6->4, etc.
      }
      showSpread();
    }

    prevBtn.addEventListener('click', goPrev);
    nextBtn.addEventListener('click', goNext);

    // Navegación con teclado
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') goNext();
      if (e.key === 'ArrowLeft')  goPrev();
    });

    // Primera vista
    showSpread();
  </script>
</body>
</html>
