<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Portafolio | Cristóbal Torres</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #050505;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            color: #eee;
        }

        .top-bar {
            position: fixed;
            top: 12px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            letter-spacing: .15em;
            opacity: .8;
            z-index: 50;
            pointer-events: none;
        }

        .viewer-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor del libro */
        #flipbook {
            width: min(95vw, 1500px); 
            height: min(90vh, 900px);
            background: #050505;
            box-shadow: 0 0 40px rgba(0,0,0,.75);
            border-radius: 4px;
            overflow: hidden;
        }

        /* Fondo interno del libro */
        .stf__wrapper { background: #050505 !important; }

        /* Páginas muy juntas */
        .stf__item { margin: 0 2.5px !important; }

        /* Lomo del libro */
        .stf__inner-shadow {
            opacity: 0.03 !important;
        }

        /* --- CORRECCIÓN CLAVE CSS: Asegurar la proporción de la imagen --- */
        .stf__block img {
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* Mantiene el aspect ratio */
            background-color: #050505; 
        }

        /* Botones */
        .controls {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
            z-index: 40;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,.25);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 40px;
            pointer-events: auto;
            cursor: pointer;
            transition: .2s;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,.15);
            border-color: rgba(255,255,255,.45);
            transform: translateY(-2px);
        }

        .ctrl-btn span {
            font-size: 26px;
            color: white;
            opacity: .85;
        }

    </style>
</head>

<body>

    <div class="top-bar">
        <div>PORTAFOLIO · CRISTÓBAL TORRES</div>
        <div id="pageIndicator">PÁGINA 1 / 34</div>
    </div>

    <div class="viewer-wrapper">
        <div id="flipbook"></div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn"><span>‹</span></button>
        <button class="ctrl-btn" id="nextBtn"><span>›</span></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const TOTAL = 34;
            const indicator = document.getElementById("pageIndicator");

            // --- CORRECCIÓN CLAVE JS: Relación de aspecto vertical (600x900) ---
            const flip = new St.PageFlip(document.getElementById("flipbook"), {
                width: 600,  
                height: 900, 
                size: "stretch",
                maxShadowOpacity: 0.1,
                showCover: true,
                autoSize: true,
                mobileScrollSupport: false
            });

            // Cargar imágenes (Se mantiene la nomenclatura original con guion '-')
            const images = [];
            for (let i = 1; i <= TOTAL; i++) {
                images.push(`pages/page-${String(i).padStart(2,"0")}.jpg`); 
            }

            flip.loadFromImages(images);

            function update() {
                let i = flip.getCurrentPageIndex() + 1;
                indicator.textContent = `PÁGINA ${i} / ${TOTAL}`;
            }

            flip.on("flip", update);
            flip.on("init", update);

            // Botones
            document.getElementById("prevBtn").onclick = () => flip.flipPrev();
            document.getElementById("nextBtn").onclick = () => flip.flipNext();

            // Teclado
            window.addEventListener("keydown", e => {
                if (e.key === "ArrowRight") flip.flipNext();
                if (e.key === "ArrowLeft") flip.flipPrev();
            });

        });
    </script>

</body>
</html>
