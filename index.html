<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Portafolio | Cristóbal Torres</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #050505;
            overflow: hidden; 
            font-family: system-ui, sans-serif;
            color: #eee;
        }

        .top-bar {
            position: fixed;
            top: 12px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            letter-spacing: .15em;
            opacity: .8;
            z-index: 50;
            pointer-events: none;
        }

        .viewer-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden; 
        }

        /* Contenedor del libro */
        #flipbook {
            width: min(95vw, 1500px); 
            height: min(90vh, 900px);
            background: #050505;
            box-shadow: 0 0 40px rgba(0,0,0,.75);
            border-radius: 4px;
            overflow: hidden;
            /* Propiedades necesarias para el Zoom y Paneo */
            transition: transform 0.2s ease-out;
            transform-origin: center center; 
            cursor: default; 
            perspective: 2000px; 
        }

        /* Fondo interno del libro */
        .stf__wrapper { background: #050505 !important; }

        /* Páginas individuales - CRÍTICO para aceleración y calidad en móvil */
        .stf__item { 
            margin: 0 2.5px !important; 
            -webkit-transform: translateZ(0); 
            transform: translateZ(0); 
        }

        /* Lomo del libro */
        .stf__inner-shadow {
            opacity: 0.03 !important;
        }

        /* Asegurar la proporción y Mejorar Calidad Visual */
        .stf__block img {
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            background-color: #050505; 
            
            /* Mejoras de calidad visual al renderizar */
            image-rendering: optimizeQuality;
            -ms-interpolation-mode: bicubic;
            
            /* Forzar alta calidad al escalar */
            -webkit-transform: translateZ(0) scale(1.0); 
            transform: translateZ(0) scale(1.0);
            backface-visibility: hidden;
        }

        /* Botones */
        .controls {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
            z-index: 40;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,.25);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 40px;
            pointer-events: auto;
            cursor: pointer;
            transition: .2s;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,.15);
            border-color: rgba(255,255,255,.45);
            transform: translateY(-2px);
        }

        .ctrl-btn span {
            font-size: 26px;
            color: white;
            opacity: .85;
        }
        
        /* ======================================= */
        /* === AJUSTES RESPONSIVOS (MEDIA QUERIES) === */
        /* ======================================= */

        /* Escritorio/Laptop (Elementos más pequeños) */
        @media (max-width: 1200px) {
            .ctrl-btn {
                width: 45px; 
                height: 45px; 
                margin: 0 20px; 
            }
            .ctrl-btn span {
                font-size: 22px; 
            }
        }

        /* Móviles (Ocultar botones y barra superior, escalar libro) */
        @media (max-width: 768px) {
            .top-bar {
                display: none;
            }
            .controls {
                display: none;
            }
            
            #flipbook {
                box-shadow: none;
                /* El libro ocupa el 95% del ancho y la altura se calcula para mantener la proporción */
                width: 95vw; 
                height: calc(95vw * (900 / 600)); 
                max-height: 90vh;
                transform: none !important; 
                transform-origin: center center;
                margin: auto; 
            }
            
            /* Forzar mejor calidad de imagen en móviles */
            .stf__block img {
                -webkit-filter: blur(0);
                filter: blur(0);
            }
        }

    </style>
</head>

<body>

    <div class="top-bar">
        <div>PORTAFOLIO · CRISTÓBAL TORRES</div>
        <div id="pageIndicator">PÁGINA 1 / 34</div>
    </div>

    <div class="viewer-wrapper">
        <div id="flipbook"></div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="prevBtn"><span>‹</span></button>
        <button class="ctrl-btn" id="nextBtn"><span>›</span></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const TOTAL = 34;
            const indicator = document.getElementById("pageIndicator");
            const flipbookElement = document.getElementById("flipbook");

            // --- DETECCIÓN DE DISPOSITIVO TÁCTIL ---
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0;

            // --- CONFIGURACIÓN DE PAGEFLIP ---
            const flip = new St.PageFlip(flipbookElement, {
                width: 600,  
                height: 900, 
                size: "stretch",
                maxShadowOpacity: 0.1,
                showCover: true,
                autoSize: true,
                // Si es táctil, permitimos el swipe (mobileScrollSupport: true)
                mobileScrollSupport: isTouchDevice,
                
                // === SOLUCIÓN FINAL: FUERZA VISTA DE UNA SOLA PÁGINA EN MÓVILES ===
                // Estos valores bajos son el "mínimo" para que el libro se muestre.
                minWidth: 100, 
                minHeight: 100, 
                
                // Si el ancho de la ventana es menor a 800px, fuerza el modo de página única.
                flippingPageOnly: window.innerWidth < 800,
            });

            // Cargar imágenes
            const images = [];
            for (let i = 1; i <= TOTAL; i++) {
                images.push(`pages/page-${String(i).padStart(2,"0")}.jpg`); 
            }

            flip.loadFromImages(images);

            function update() {
                let i = flip.getCurrentPageIndex() + 1;
                indicator.textContent = `PÁGINA ${i} / ${TOTAL}`;
            }

            flip.on("flip", update);
            flip.on("init", update);

            // Botones
            document.getElementById("prevBtn").onclick = () => flip.flipPrev();
            document.getElementById("nextBtn").onclick = () => flip.flipNext();

            // Teclado
            window.addEventListener("keydown", e => {
                if (e.key === "ArrowRight") flip.flipNext();
                if (e.key === "ArrowLeft") flip.flipPrev();
            });

            // ==========================================================
            // === FUNCIONALIDAD DE ZOOM FOCAL Y PANEO (SOLO ESCRITORIO) ===
            // ==========================================================
            
            if (!isTouchDevice) {
                let currentScale = 1;
                const SCALE_STEP = 0.15;
                const MAX_SCALE = 3;
                const MIN_SCALE = 1;

                // 1. Manejo del Zoom (Scroll con Ruedita)
                flipbookElement.addEventListener('wheel', (e) => {
                    e.preventDefault(); 
                    const direction = e.deltaY < 0 ? 1 : -1; 
                    let newScale = currentScale + (direction * SCALE_STEP);
                    newScale = Math.min(Math.max(MIN_SCALE, newScale), MAX_SCALE);

                    if (newScale === currentScale) return;

                    // CÁLCULO DEL PUNTO FOCAL
                    const rect = flipbookElement.getBoundingClientRect();
                    const xPercent = ((e.clientX - rect.left) / rect.width) * 100;
                    const yPercent = ((e.clientY - rect.top) / rect.height) * 100;
                    
                    flipbookElement.style.transformOrigin = `${xPercent}% ${yPercent}%`;
                    flipbookElement.style.transform = `scale(${newScale})`;
                    currentScale = newScale;

                    // Actualiza el cursor y el scroll de la página para el paneo
                    if (currentScale > 1) {
                        flipbookElement.style.cursor = 'grab';
                        document.body.style.overflow = 'auto'; 
                    } else {
                        flipbookElement.style.cursor = 'default';
                        document.body.style.overflow = 'hidden'; 
                    }

                }, { passive: false }); 


                // 2. Manejo del Paneo (Arrastre con Mouse)
                let isPanning = false;
                let startX, startY, scrollLeft, scrollTop;

                flipbookElement.addEventListener('mousedown', (e) => {
                    if (currentScale > 1) {
                        isPanning = true;
                        flipbookElement.style.cursor = 'grabbing';
                        startX = e.clientX;
                        startY = e.clientY;
                        scrollLeft = window.scrollX;
                        scrollTop = window.scrollY;
                    }
                });

                window.addEventListener('mouseup', () => {
                    isPanning = false;
                    if (currentScale > 1) {
                        flipbookElement.style.cursor = 'grab';
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isPanning || currentScale <= 1) return;
                    e.preventDefault();
                    
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;

                    window.scrollTo(scrollLeft - dx, scrollTop - dy);
                });
            }

        });
    </script>

</body>
</html>
