<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Portafolio | Cristóbal Torres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      background: #050505;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f5f5;
    }
    .top-bar {
      position: fixed;
      top: 10px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.7;
      pointer-events: none;
      z-index: 10;
    }
    .viewer-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #222 0, #050505 55%);
    }
    .page-frame {
      width: min(90vw, 1200px);
      height: min(90vh, 900px);
      background: #101010;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .page-frame img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.25s ease;
    }
    .controls {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }
    .ctrl-btn {
      pointer-events: auto;
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 36px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
    }
    .ctrl-btn span {
      font-size: 26px;
      line-height: 1;
      opacity: 0.85;
    }
    .ctrl-btn:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.45);
    }
    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: default;
      transform: none;
    }
    @media (max-width: 768px) {
      .page-frame {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
      .ctrl-btn {
        margin: 0 10px;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>PORTAFOLIO · CRISTÓBAL TORRES</div>
    <div id="pageIndicator">PÁGINA 1 / 34</div>
  </div>

  <div class="viewer-wrapper">
    <div class="page-frame">
      <img id="pageImage" src="" alt="Página del portafolio" />
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Página anterior">
      <span>‹</span>
    </button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Página siguiente">
      <span>›</span>
    </button>
  </div>

  <script>
    const TOTAL_PAGES = 34;
    let currentPage = 1;

    const imgEl = document.getElementById("pageImage");
    const indicatorEl = document.getElementById("pageIndicator");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function pageSrc(n) {
      const s = String(n).padStart(2, "0");
      return `pages/page-${s}.jpg`;
    }

    function updateButtons() {
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === TOTAL_PAGES;
    }

    function updateIndicator() {
      indicatorEl.textContent = `PÁGINA ${currentPage} / ${TOTAL_PAGES}`;
    }

    function showPage(n) {
      if (n < 1 || n > TOTAL_PAGES) return;
      currentPage = n;
      imgEl.style.opacity = "0";
      const src = pageSrc(currentPage);
      const tmp = new Image();
      tmp.onload = () => {
        imgEl.src = src;
        imgEl.style.opacity = "1";
      };
      tmp.src = src;
      updateButtons();
      updateIndicator();
    }

    prevBtn.addEventListener("click", () => showPage(currentPage - 1));
    nextBtn.addEventListener("click", () => showPage(currentPage + 1));

    // permitir cambiar con teclado
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") showPage(currentPage + 1);
      if (e.key === "ArrowLeft") showPage(currentPage - 1);
    });

    // página inicial
    showPage(1);
  </script>
</body>
</html>
