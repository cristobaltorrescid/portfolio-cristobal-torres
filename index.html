<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Portafolio | Cristóbal Torres</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: #050505;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: #f5f5f5;
    }

    .top-bar {
      position: fixed;
      top: 10px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.75;
      z-index: 20;
      pointer-events: none;
    }

    .viewer-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #222 0, #050505 60%);
    }

    .book-frame {
      width: min(95vw, 1400px);
      height: min(90vh, 900px);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
      border-radius: 4px;
      overflow: hidden;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .page-view {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.25s ease, transform 0.25s ease;
      opacity: 1;
    }

    .page-view.hidden {
      opacity: 0;
      transform: translateX(-20px);
      pointer-events: none;
    }

    .single-page {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .spread {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      gap: 5px; /* separación entre páginas ~5px */
    }

    .spread img {
      max-width: 50%;
      max-height: 100%;
      object-fit: contain;
      background: #fff;
    }

    .controls {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      z-index: 30;
    }

    .ctrl-btn {
      pointer-events: auto;
      width: 52px;
      height: 52px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 36px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
    }

    .ctrl-btn span {
      font-size: 26px;
      line-height: 1;
      opacity: 0.85;
    }

    .ctrl-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: default;
      transform: none;
    }

    @media (max-width: 768px) {
      .book-frame {
        width: 100vw;
        height: 100vh;
        box-shadow: none;
        border-radius: 0;
      }

      .spread img {
        max-width: 100%;
      }

      .spread {
        gap: 2px;
      }

      .ctrl-btn {
        margin: 0 10px;
      }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>PORTAFOLIO · CRISTÓBAL TORRES</div>
    <div id="pageIndicator">PÁGINA 1 / 34</div>
  </div>

  <div class="viewer-wrapper">
    <div class="book-frame">
      <div class="page-view" id="pageView"></div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Anterior">
      <span>‹</span>
    </button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Siguiente">
      <span>›</span>
    </button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const TOTAL_PAGES = 34; // cambia esto si tu portafolio tiene otro número

      const pageView = document.getElementById("pageView");
      const indicator = document.getElementById("pageIndicator");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      // Estructura:
      //  - 0: portada (página 1)
      //  - 1: páginas 2–3
      //  - 2: páginas 4–5
      //  - ...
      const views = [];

      // Portada
      views.push({ type: "single", pages: [1] });

      // Spreads interiores
      for (let p = 2; p <= TOTAL_PAGES; p += 2) {
        if (p + 1 <= TOTAL_PAGES) {
          views.push({ type: "spread", pages: [p, p + 1] });
        } else {
          // Si el total es impar, última página sola
          views.push({ type: "single", pages: [p] });
        }
      }

      let currentViewIndex = 0;

      function pagePath(pageNumber) {
        const num = String(pageNumber).padStart(2, "0");
        return `pages/page-${num}.jpg`;
      }

      function renderView(index, direction = 0) {
        const view = views[index];
        if (!view) return;

        // Animación simple: fade + slide
        pageView.classList.add("hidden");

        setTimeout(() => {
          pageView.innerHTML = "";

          if (view.type === "single") {
            const img = document.createElement("img");
            img.className = "single-page";
            img.src = pagePath(view.pages[0]);
            img.alt = `Página ${view.pages[0]}`;
            pageView.appendChild(img);
          } else if (view.type === "spread") {
            const spread = document.createElement("div");
            spread.className = "spread";

            view.pages.forEach((p) => {
              const img = document.createElement("img");
              img.src = pagePath(p);
              img.alt = `Página ${p}`;
              spread.appendChild(img);
            });

            pageView.appendChild(spread);
          }

          // Actualizar indicador de páginas
          if (view.type === "single") {
            indicator.textContent = `PÁGINA ${view.pages[0]} / ${TOTAL_PAGES}`;
          } else {
            indicator.textContent = `PÁGINAS ${view.pages[0]}–${view.pages[1]} / ${TOTAL_PAGES}`;
          }

          // Actualizar botones
          prevBtn.disabled = index === 0;
          nextBtn.disabled = index === views.length - 1;

          // Ajuste de dirección en la animación
          pageView.style.transform =
            direction > 0 ? "translateX(20px)" : direction < 0 ? "translateX(-20px)" : "translateX(0)";
          // Reaparecer
          requestAnimationFrame(() => {
            pageView.classList.remove("hidden");
            pageView.style.transform = "translateX(0)";
          });
        }, 200);
      }

      prevBtn.addEventListener("click", () => {
        if (currentViewIndex > 0) {
          currentViewIndex -= 1;
          renderView(currentViewIndex, -1);
        }
      });

      nextBtn.addEventListener("click", () => {
        if (currentViewIndex < views.length - 1) {
          currentViewIndex += 1;
          renderView(currentViewIndex, 1);
        }
      });

      // Navegación con teclado
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          nextBtn.click();
        } else if (e.key === "ArrowLeft") {
          prevBtn.click();
        }
      });

      // Render inicial
      renderView(currentViewIndex);
    });
  </script>
</body>
</html>
